<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFダウンロード</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #0f1b2d;
      color: white;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }
    .box {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      color: #111;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #666; line-height: 1.6; }
    .big {
      display: block;
      background: #c9a227;
      color: #111;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      padding: 20px;
      border-radius: 14px;
      margin: 20px 0 12px;
    }
    .sub {
      display: block;
      background: #f1f5f9;
      color: #111;
      text-decoration: none;
      font-size: 15px;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .note {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: left;
      margin-top: 16px;
    }
    ol { text-align: left; font-size: 13px; color: #555; padding-left: 18px; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📄 映像制作 提案資料</h1>
    <p>全12ページ PDF</p>

    <div class="note">
      <strong>Chromeだと開くだけです</strong><br>
      必ず <strong>Safari</strong> で開いてください
    </div>

    <a class="big" href="/download-zip">⬇️ ZIPでダウンロード（おすすめ）</a>
    <a class="sub" href="/download-pdf">PDFでダウンロード</a>

    <ol>
      <li>上のボタンをタップ</li>
      <li>「ダウンロード」を選ぶ</li>
      <li>ファイルアプリ → ダウンロード</li>
      <li>ZIPの場合はタップして中のPDFを開く</li>
    </ol>
  </div>
</body>
</html>
